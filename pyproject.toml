[project]
name = "moverec"
version = "0.1.0"
description = "Hybrid add-on recommender for moving bookings, demonstrated on SYNTHETIC data"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
